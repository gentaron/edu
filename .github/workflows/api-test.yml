name: API Auto Test (Bruno MCP)

on:
  pull_request:
    paths:
      - "src/app/api/**"
  schedule:
    - cron: "0 6 * * 1"  # Weekly Monday 6am UTC

jobs:
  api-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          DATABASE_URL: "file:./test.db"

      - name: Start server
        run: bun run start &
        env:
          PORT: 3000
          DATABASE_URL: "file:./test.db"

      - name: Wait for server
        run: npx wait-on http://localhost:3000/api --timeout 30000

      - name: Run API tests
        run: |
          for test in \
            "GET /api" \
            "GET /api/game" \
            "GET /api/export?format=html&category=all" \
            "GET /api/tournament/bound"; do
            METHOD=$(echo $test | cut -d' ' -f1)
            PATH=$(echo $test | cut -d' ' -f2)
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' -X $METHOD "http://localhost:3000$PATH")
            if [ "$STATUS" -ge 400 ]; then
              echo "FAIL: $test -> $STATUS"
              exit 1
            fi
            echo "PASS: $test -> $STATUS"
          done

          # POST tests
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' -X POST "http://localhost:3000/api/wiki/related" \
            -H "Content-Type: application/json" -d '{"entryId":"Diana","limit":5}')
          if [ "$STATUS" -ge 400 ]; then echo "FAIL: POST /api/wiki/related -> $STATUS"; exit 1; fi
          echo "PASS: POST /api/wiki/related -> $STATUS"

      - name: Test Results Summary
        if: always()
        run: echo "API test run completed. Check logs above for details."
