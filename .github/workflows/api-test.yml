name: API Auto Test (Bruno MCP)

on:
  pull_request:
    paths:
      - "src/app/api/**"
      - "src/app/wiki/**"
      - ".github/workflows/api-test.yml"
  push:
    branches: [main]
    paths:
      - "src/app/api/**"
      - "src/app/wiki/**"
      - ".github/workflows/api-test.yml"
  schedule:
    - cron: "0 6 * * 1"  # Weekly Monday 6am UTC

jobs:
  api-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          DATABASE_URL: "file:./test.db"

      - name: Start server
        run: bun run start &
        env:
          PORT: 3000
          DATABASE_URL: "file:./test.db"

      - name: Wait for server
        run: npx wait-on http://localhost:3000/api --timeout 30000

      - name: Run API tests
        run: |
          for test in \
            "GET /api" \
            "GET /api/game" \
            "GET /api/export?format=html&category=all" \
            "GET /api/tournament/bound" \
            "GET /api/characters" \
            "GET /api/characters/directory" \
            "GET /api/characters/population" \
            "GET /api/characters/detail/43303032"; do
            read -r METHOD API_PATH <<< "$test"
            STATUS=$(curl --silent --show-error --max-time 30 -o /dev/null -w '%{http_code}' -X "$METHOD" "http://localhost:3000$API_PATH")
            if [[ "$STATUS" != 2[0-9][0-9] ]]; then
              echo "FAIL: $test -> $STATUS"
              exit 1
            fi
            echo "PASS: $test -> $STATUS"
          done

          # Verify payload shape, not just a 200 from the wrong cached response.
          bun -e 'const base="http://localhost:3000/api/characters"; const read=async p=>{const r=await fetch(base+p); if(!r.ok) throw Error(p); return r.json()}; const d=await read("/directory"); const p=await read("/population"); if(!d.rows?.some(x=>x.state && Number.isFinite(x.state.h)) || !p.rows?.some(x=>x.cid==="C002" && Number.isFinite(x.h))) throw Error("Invalid directory or population"); const alias=await read("/detail/43303032"); if(typeof alias.redirect!=="string") throw Error("Invalid redirect"); const key=Buffer.from(alias.redirect).toString("hex"); const detail=await read("/detail/"+key); if(!detail.people?.some(x=>x.person.id==="C002" && Number.isFinite(x.state?.h))) throw Error("Missing Wiki character values")'

          # POST tests
          STATUS=$(curl --silent --show-error --max-time 30 -o /dev/null -w '%{http_code}' -X POST "http://localhost:3000/api/wiki/related" \
            -H "Content-Type: application/json" -d '{"entryId":"Diana","limit":5}')
          if [[ "$STATUS" != 2[0-9][0-9] ]]; then echo "FAIL: POST /api/wiki/related -> $STATUS"; exit 1; fi
          echo "PASS: POST /api/wiki/related -> $STATUS"

      - name: Test Results Summary
        if: always()
        run: echo "API test run completed. Check logs above for details."
