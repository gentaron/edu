name: Security Scan

# Informational only — runs weekly (and on demand), never gates merges.
# All steps are non-blocking so upstream advisories don't block the app.
on:
  schedule:
    - cron: "0 3 * * 1" # Weekly Monday 3am UTC
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Trivy dependency scan (report only)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "HIGH,CRITICAL"
          exit-code: "0"
          format: "table"

      - name: Semgrep SAST (report only)
        continue-on-error: true
        uses: returntocorp/semgrep-action@v1
        with:
          config: "p/typescript p/javascript p/secrets p/security-audit"
          args: "--exclude='crates/' --exclude='node_modules/' --exclude='skills/'"
