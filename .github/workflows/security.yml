name: Security Scan

# Informational only — runs weekly (and on demand), never gates merges.
# All steps are non-blocking so upstream advisories don't block the app.
on:
  schedule:
    - cron: "0 3 * * 1" # Weekly Monday 3am UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Trivy dependency scan (report only)
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec # master
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "HIGH,CRITICAL"
          exit-code: "0"
          format: "table"

      - name: Semgrep SAST (report only)
        continue-on-error: true
        uses: returntocorp/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: "p/typescript p/javascript p/secrets p/security-audit"
          args: "--exclude='crates/' --exclude='node_modules/' --exclude='skills/'"
